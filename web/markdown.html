<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Markdown preview</title>
  <!-- No script from the document: a javascript: link or other trick in the text cannot run. -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'" />
  <base href="/file/" />
  <style>
    body { margin: 0; background: #fff; color: #1f1f1f; font: 16px/1.6 Georgia, "Times New Roman", serif; }
    main { max-width: 42rem; margin: 0 auto; padding: 32px 24px 96px; }
    h1, h2, h3, h4 { font-family: -apple-system, system-ui, sans-serif; line-height: 1.25; margin: 1.6em 0 0.6em; }
    a { color: #005fb8; }
    img { max-width: 100%; }
    pre, code { font: 0.9em ui-monospace, Menlo, monospace; background: #f3f3f3; border-radius: 4px; }
    code { padding: 0.1em 0.3em; }
    pre { padding: 12px; overflow-x: auto; }
    pre code { padding: 0; background: none; }
    blockquote { margin: 0; padding-left: 1em; border-left: 3px solid #ddd; color: #555; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 4px 10px; }
    .katex-display { overflow-x: auto; overflow-y: hidden; }
  </style>
</head>
<body>
  <main id="doc"></main>
  <script type="module" src="./markdown.ts"></script>
</body>
</html>

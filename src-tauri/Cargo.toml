[package]
name = "quire"
# The app's version (tauri.conf.json has none). A release is the git tag v<version>.
version = "0.2.3"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
libc = "0.2"
tokio = { version = "1.53.1", features = ["macros", "process", "net", "io-util", "time", "sync", "signal", "rt-multi-thread"] }
tokio-tungstenite = "0.29"
futures-util = "0.3.34"
notify = "8.2.0"
trash = "5.2.9"
regex = "1.13.1"
unicode-normalization = "0.1.25"
serde_json = "1.0.151"
percent-encoding = "2"
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-html = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-files", "system-downloader", "datetime", "emit-diagnostics"] }
typst-layout = "0.15.1"

# Smaller app binary (Tauri's size guide). No panic = "abort": a bug in one request must
# not close the window with the writer's text in it.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

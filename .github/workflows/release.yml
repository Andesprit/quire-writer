# Push a tag v<version> (the version in src-tauri/Cargo.toml) to build Quire for Apple Silicon
# Macs. The result is a draft GitHub release: publish it, and installed apps update themselves.
name: Release

on:
  push:
    tags: ["v*"]

env:
  TINYMIST: v0.15.8 # bundled with the app for the Typst preview

jobs:
  macos:
    runs-on: macos-latest # Apple Silicon
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in src-tauri/Cargo.toml"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the page
        working-directory: web
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Get tinymist
        run: |
          mkdir -p build/bin && cd build/bin
          file=tinymist-aarch64-apple-darwin.tar.gz
          curl -fsSLO "https://github.com/Myriad-Dreamin/tinymist/releases/download/$TINYMIST/$file"
          curl -fsSLO "https://github.com/Myriad-Dreamin/tinymist/releases/download/$TINYMIST/$file.sha256"
          shasum -a 256 -c "$file.sha256"
          tar xzf "$file" --strip-components 1
          mv tinymist tinymist-aarch64-apple-darwin # the sidecar name Tauri expects
          rm "$file" "$file.sha256"

      - name: Apple signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri signs and notarizes when these are set. Without them it signs ad hoc: the app
          # runs, but macOS warns on first open.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple secrets: this release is not notarized, and macOS will warn on first open."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s<<END_%s\n%s\nEND_%s\n' "$v" "$v" "${!v}" "$v" >> "$GITHUB_ENV"
          done

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files; installed apps only accept updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Quire ${{ github.ref_name }}
          releaseBody: |
            Download the `.dmg` below, open it and drag Quire to Applications. Needs a Mac with Apple Silicon.
            Installed copies update themselves once this release is published.
          releaseDraft: true
          args: --config '{"bundle":{"createUpdaterArtifacts":true}}'

# Push a tag v<version> (the version in src-tauri/Cargo.toml) to build Quire for Apple Silicon
# Macs and, experimentally, for Linux and Windows (x86_64). The result is a draft GitHub
# release: publish it, and installed apps update themselves.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      publish: true
    secrets: inherit
    permissions:
      contents: write
